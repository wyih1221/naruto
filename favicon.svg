    <g stroke="#b97240" stroke-width="1.35" stroke-linecap="round" opacity=".8">
      <path d="M18.6 43.4 L22.1 44.2"/>
      <path d="M18.3 46.2 L22 46.3"/>
      <path d="M18.7 49 L22 48.5"/>
      <path d="M45.4 43.4 L41.9 44.2"/>
      <path d="M45.7 46.2 L42 46.3"/>
      <path d="M45.3 49 L42 48.5"/>
    </g>

