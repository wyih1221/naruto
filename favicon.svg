    <ellipse cx="23" cy="46.6" rx="2.6" ry="1.5" fill="#f79a72" opacity=".3"/>
    <ellipse cx="41" cy="46.6" rx="2.6" ry="1.5" fill="#f79a72" opacity=".3"/>

