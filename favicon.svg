    <path d="M17.8 27.2 Q32 24.6 46.2 27.2 L46.2 31.5 Q32 28.9 17.8 31.5 Z" fill="url(#band)"/>
    <path d="M17.8 27.2 Q32 24.6 46.2 27.2 L46.2 28.1 Q32 25.5 17.8 28.1 Z" fill="#5b8cf0" opacity=".85"/>
    <path d="M17.8 31.5 Q32 28.9 46.2 31.5 L46.2 32.3 Q32 29.7 17.8 32.3 Z" fill="#0b1740"/>

