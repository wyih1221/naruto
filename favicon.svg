<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hair" x1=".15" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#ffe98f"/>
      <stop offset=".38" stop-color="#ffcb38"/>
      <stop offset=".78" stop-color="#f5ae15"/>
      <stop offset="1" stop-color="#dd9209"/>
    </linearGradient>
    <linearGradient id="skin" x1=".2" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#ffe8ca"/>
      <stop offset=".62" stop-color="#fbce9f"/>
      <stop offset="1" stop-color="#efb27c"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2=".15" y2="1">
