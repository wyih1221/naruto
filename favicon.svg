    <path d="M32 43.4 q1.1 1.6 -.7 2" fill="none" stroke="#d08f5c" stroke-width="1.1" stroke-linecap="round"/>

    <!-- 咧嘴笑 -->
    <path d="M26.4 45.8 Q32 52.4 37.6 45.8 Q32 47.8 26.4 45.8 Z"
          fill="#ffffff" stroke="#8a3f18" stroke-width="1.35" stroke-linejoin="round"/>

    <!-- 橙色外套 -->
    <path d="M6.4 64 Q8 54.4 19.2 51.2 L32 58.4 L44.8 51.2 Q56 54.4 57.6 64 Z" fill="#ff7a18"/>
    <path d="M23.8 60.4 L32 64.4 L40.2 60.4 L32 55.8 Z" fill="#132a6e"/>
    <path d="M6.4 64 Q8 54.4 19.2 51.2 L19.2 64 Z" fill="#cf5408" opacity=".42"/>
    <path d="M19.2 51.2 L32 58.4 L44.8 51.2 L44.8 53.6 L32 60.8 L19.2 53.6 Z" fill="#ffb069" opacity=".55"/>
