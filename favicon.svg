    <path d="M32 23.8 C24.2 23.8 18.6 29.8 18.6 37.4 C18.6 46.6 24.8 53.6 32 53.6 C39.2 53.6 45.4 46.6 45.4 37.4 C45.4 29.8 39.8 23.8 32 23.8 Z"
