    <ellipse cx="38.4" cy="41.2" rx="4.4" ry="5.1" fill="#ffffff"/>
    <circle cx="26" cy="41.5" r="3.3" fill="#3d8ce4"/>
    <circle cx="38" cy="41.5" r="3.3" fill="#3d8ce4"/>
    <circle cx="26" cy="41.5" r="1.6" fill="#0a1930"/>
    <circle cx="38" cy="41.5" r="1.6" fill="#0a1930"/>
    <circle cx="24.6" cy="39.6" r="1.4" fill="#ffffff"/>
    <circle cx="37" cy="39.6" r="1.4" fill="#ffffff"/>
    <circle cx="27.4" cy="43.6" r=".7" fill="#ffffff" opacity=".85"/>
    <circle cx="39.8" cy="43.6" r=".7" fill="#ffffff" opacity=".85"/>
    <path d="M21 39.8 Q25.6 35.6 30.2 39.8 M33.8 39.8 Q38.4 35.6 43 39.8"
